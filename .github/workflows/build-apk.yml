name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master, main, "feature/**"]
    paths:
      - "TMessagesProj/**"
      - "TMessagesProj_App/**"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK (artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install pinned NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" >/dev/null || true

      - name: Build debug APK
        run: ./gradlew :TMessagesProj_App:assembleDebug --stacktrace

      - name: Build release APK (unsigned, for tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        run: ./gradlew :TMessagesProj_App:assembleRelease --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nabz-debug-apk
          path: TMessagesProj_App/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: nabz-release-apk
          path: TMessagesProj_App/build/outputs/apk/release/*.apk
          if-no-files-found: warn
