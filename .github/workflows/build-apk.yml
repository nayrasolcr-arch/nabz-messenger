name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master, main, "feature/**"]
    paths:
      - "TMessagesProj/**"
      - "TMessagesProj_App/**"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK (artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install pinned NDK + ccache
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" >/dev/null || true
          sudo apt-get update -qq && sudo apt-get install -y -qq ccache

      - name: Cache ccache (native builds)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-afat-arm64-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-afat-arm64-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=1G || true
          ccache --set-config=compiler_check=content || true
          ccache --set-config=sloppiness=file_stat_matches,pch_defines,time_macros || true
          ccache -z || true

      - name: Build debug APK (arm64 only, faster)
        env:
          NDK_CCACHE: ccache
          CCACHE_DIR: ~/.ccache
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug -PnabzAbis=arm64-v8a -PnabzCcache=true --stacktrace

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: Build release APK (unsigned, for tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NDK_CCACHE: ccache
          CCACHE_DIR: ~/.ccache
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease -PnabzAbis=arm64-v8a -PnabzCcache=true --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nabz-debug-apk
          path: TMessagesProj_App/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: nabz-release-apk
          path: TMessagesProj_App/build/outputs/apk/**/release/*.apk
          if-no-files-found: warn
